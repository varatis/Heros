project_id = "herobook"

[db.seed]
# Le reset Supabase rejoue ces seeds après toutes les migrations.
enabled = true
sql_paths = [
  "./seed/001_loup_solitaire_01_adaptation_50.sql",
  "./seed/002_loup_solitaire_02_traversee_infernale.sql",
  "./seed/003_loup_solitaire_03_grottes_kalte.sql",
  "./seed/004_loup_solitaire_04_gouffre_maudit.sql",
  "./seed/005_loup_solitaire_05_tyran_desert.sql",
]

# ============================================================
# Edge Functions — monétisation sécurisée (migration 005)
# Voir docs/EDGE_FUNCTIONS.md pour l'architecture complète.
# ============================================================

# Choix narratifs (premium inclus) : JWT utilisateur obligatoire
[functions.make-choice]
verify_jwt = true

# Consommation d'objets en jeu : JWT utilisateur obligatoire
[functions.apply-item-effect]
verify_jwt = true

# Récompense quotidienne (streak) : JWT utilisateur obligatoire
[functions.grant-daily-reward]
verify_jwt = true

# Initialisation de partie : JWT utilisateur obligatoire
[functions.init-game]
verify_jwt = true

# Actions de configuration (disciplines, équipement, Hasard) : JWT utilisateur obligatoire
[functions.game-setup-action]
verify_jwt = true

# Webhook RevenueCat : appelé serveur-à-serveur par RevenueCat
# (pas de JWT utilisateur — authentification par signature X-Signature
#  HMAC-SHA1 ou Bearer REVENUECAT_WEBHOOK_SECRET)
[functions.validate-purchase]
verify_jwt = false
