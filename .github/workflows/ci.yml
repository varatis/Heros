name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: PDF LS02 + moteurs + SQL + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migrations + assertions sur un vrai Postgres embarqué (PGlite/WASM)
      - name: Test migrations DB
        run: npm run test:db

      # Type-check strict de toute l'app Next.js
      - name: Type-check
        run: npx tsc --noEmit

      - name: Test moteur de combat
        run: npm run test:combat

      - name: Test parties complètes
        run: npm run test:play
      - name: Setup Python pour la vérification directe du PDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vérifier la source PDF LS02 indépendamment du contenu généré
        run: |
          python -m pip install -r scripts/requirements-ls02.txt
          python scripts/ls02-extract-source.py --check

      - name: Tester LS02 (PDF, graphe, règles, SQL et parcours)
        run: npm run test:ls02

      - name: Non-régression inventaire, soins et sauvegardes locales
        run: node scripts/tester-confort-lecture.cjs
