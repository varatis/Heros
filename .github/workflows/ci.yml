name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Migrations DB + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migrations + assertions sur un vrai Postgres embarqué (PGlite/WASM)
      - name: Test migrations DB
        run: npm run test:db

      # Type-check strict de toute l'app Next.js
      - name: Type-check
        run: npx tsc --noEmit